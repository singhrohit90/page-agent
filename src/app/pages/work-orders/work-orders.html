<h1>Work orders</h1>
<p><a routerLink="/work-orders/new" class="button">New work order</a></p>
<table id="work-orders-table">
	<thead>
		<tr>
			<th>ID</th>
			<th>Title</th>
			<th>Station</th>
			<th>Priority</th>
			<th>Type</th>
			<th>Due</th>
			<th>Assignee</th>
			<th>Status</th>
		</tr>
	</thead>
	<tbody>
		@for (w of rows(); track w.id) {
			<tr>
				<td>{{ w.id }}</td>
				<td>{{ w.title }}</td>
				<td>{{ w.stationId }}</td>
				<td>{{ w.priority }}</td>
				<td>{{ w.type }}</td>
				<td>{{ w.due }}</td>
				<td>{{ w.assignee }}</td>
				<td>{{ w.status }}</td>
			</tr>
		}
	</tbody>
</table>
